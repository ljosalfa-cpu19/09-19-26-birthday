<header class="page-header page-fade">
  <h1>Gallery ♡</h1>
  <p>A collection of moments with you.</p>
</header>

<div class="gallery-filters" id="gallery-filters">
  <button data-filter="all" class="active">All</button>
  <button data-filter="memories">Call Logs</button>
  <button data-filter="us">Special Dates</button>
  <button data-filter="special">Days that celebrated</button>
</div>

<section class="gallery-grid page-fade" id="gallery-grid" aria-label="Photo gallery"></section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close photo viewer">✕</button>
  <button class="lightbox-btn lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
    <div class="counter" id="lightbox-counter"></div>
  </div>
  <button class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
</div>

<footer class="site-footer">✦ this isn't just a website, this is our little world ✦</footer>
<button id="music-toggle" aria-label="Play music" data-playing="false">♪̸</button>
<!-- ✏️ EDIT ME: point src at your own music file (mp3) if you'd like background music -->
<audio id="bg-music" loop src="song.mp3" preload="auto"></audio>

<script src="main.js"></script>
<script src="autoplay-music.js"></script>
<script src="gallery.js"></script>
</body>
</html>
