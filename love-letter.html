<!-- =========================
     LOVE LETTER TYPING EFFECT
========================= -->

<script>
(function () {

  const prefersReducedMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const el = document.getElementById("letter-text");
  const scrollBox = document.getElementById("letter-scroll");
  const nextBtn = document.getElementById("letter-next");

  if (!el || !scrollBox || !nextBtn) {
    return;
  }

  /*
    Each %% creates a new paragraph.
  */
  const paragraphs = el.dataset.fullText.split("%%");

  /*
    If the visitor prefers reduced motion,
    display the entire letter immediately.
  */
  if (prefersReducedMotion) {

    el.innerHTML = paragraphs
      .map(function (p) {
        const paragraph = document.createElement("p");
        paragraph.textContent = p;
        return paragraph.outerHTML;
      })
      .join("");

    nextBtn.style.display = "inline-flex";

    return;
  }

  /*
    Normal typing mode.
  */

  el.innerHTML = "";

  let pIndex = 0;
  let cIndex = 0;

  let currentP = document.createElement("p");
  el.appendChild(currentP);

  const cursor = document.createElement("span");
  cursor.className = "letter-cursor";

  currentP.appendChild(cursor);

  function typeStep() {

    /*
      Finished all paragraphs.
    */
    if (pIndex >= paragraphs.length) {

      if (cursor.parentNode) {
        cursor.remove();
      }

      nextBtn.style.display = "inline-flex";

      return;
    }

    const para = paragraphs[pIndex];

    /*
      Continue typing the current paragraph.
    */
    if (cIndex < para.length) {

      const character = para[cIndex];

      cursor.insertAdjacentText(
        "beforebegin",
        character
      );

      cIndex++;

      /*
        Automatically keep the newest text visible,
        but don't fight the user if they manually scroll upward.
      */
      if (
        scrollBox.scrollTop + scrollBox.clientHeight >=
        scrollBox.scrollHeight - 40
      ) {
        scrollBox.scrollTop = scrollBox.scrollHeight;
      }

      /*
        Base typing speed.
        Slight randomness makes it feel more natural.
      */
     const base = 30;
const variance = Math.random() * 40;

      /*
        Slight pause after punctuation.
      */
      const pausePunct =
        /[.,!?]/.test(para[cIndex - 1])
          ? 180
          : 0;

      setTimeout(
        typeStep,
        base + variance + pausePunct
      );

    } else {

      /*
        Current paragraph finished.
        Create the next paragraph.
      */
      pIndex++;
      cIndex = 0;

      currentP = document.createElement("p");

      el.appendChild(currentP);

      currentP.appendChild(cursor);

      /*
        Small pause between paragraphs.
      */
      setTimeout(typeStep, 260);
    }
  }

  /*
    Small delay before the letter starts typing.
  */
  setTimeout(typeStep, 400);

})();
</script>
